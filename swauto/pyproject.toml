[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swauto"
version = "0.1.0"
description = "Cross-platform Summoners War automation framework (clean-room rebuild)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pycryptodome>=3.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# The own-account login capture proxy. Optional because mitmproxy is a heavy
# stack (mitmproxy + cryptography); the pure core never imports it. Only this
# extra triggers a cryptography downgrade on Python 3.14 (mitmproxy pins
# cryptography<49 currently) — the base package keeps pycryptodome only.
proxy = [
    "mitmproxy>=11",
]

[project.scripts]
swauto = "swauto.ui.headless:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
